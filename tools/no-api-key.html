<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API key not set</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #111;
      color: #eaeaea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 460px; margin: 24px; padding: 30px 32px;
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      box-shadow: 0 16px 40px #000a;
      text-align: center;
    }
    .icon { font-size: 42px; line-height: 1; }
    h1 { font-size: 20px; margin: 14px 0 10px; }
    p { color: #9a9a9a; font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
    code { background: #000; color: #7fd1ff; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    a { display: inline-block; margin-top: 20px; color: #7fd1ff; text-decoration: none; font-size: 14px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔑</div>
    <h1>API key not set</h1>
    <p>The Asset Foundry needs an OpenAI API key to generate images.</p>
    <p>Add <code>OPENAI_API_KEY</code> to your <code>.env</code> file, then restart <code>bun&nbsp;run&nbsp;dev</code>.</p>
    <a href="/">&larr; Back to the game</a>
  </div>
</body>
</html>
